<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: '맑은 고딕', sans-serif;
            background-color: rgb(223, 208, 187);
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;

        }

        .nav {
            display: flex;
            
            border-bottom: 2px solid #ddd;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
        }

        .logo {
            background-color: rgb(89, 175, 255);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .menu {
            color:black;
            font-weight: bold;
        }


    </style>
</head>

<body>
    <div class="container">

        <div class="nav">
            <div class="logo">로고</div>
            <div class="menu">메뉴들</div>
        </div>

    </div>
</body>

</html>
