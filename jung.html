<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .king-box {
            width: 800px;
            height: 600px;
            background-color: rgb(247, 124, 124);
            margin: 0 auto;
            margin-top: 130px;
        }
        .one-container {
            height: 100px;
            width: 800px;
            display: flex;
        }
        .yellow-box {
            background-color: yellow;
            height: 100px;
            width: 50%;
        }
        .gray-box {
            background-color: gray;
            height: 100px;
            width: 50%;
        }

        .two-container {
            background-color: blueviolet;
            height: 100px;
            width: 800px;
        }
        .three-container {
            background-color: lightblue;
            height: 200px;
            width: 800px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .yellow-box2 {
            width: 520px;
            height: 100px;
            background-color: yellow;
        }
        .peach-box {
            width: 520px;
            height: 100px;
            background-color: darksalmon;
        }
        .last-box {
            height: 200px;
            width: 800px;
            display: flex;
        }
        
        .yellow01-box {
            background-color: rgb(255, 255, 169);
            height: 200px;
            width: 200px;
            display: flex;
        }
                .blue01-box {
            background-color: rgb(46, 23, 175);
            height: 200px;
            width: 200px;
            display: flex;
        }
                .violet-box {
            background-color: rgb(190, 120, 211);
            height: 200px;
            width: 200px;
            display: flex;
        }
                .mint-box {
            background-color: rgb(68, 243, 255);
            height: 200px;
            width: 200px;
            display: flex;
        }

    </style>

</head>

<body>
    <div class="king-box">
        <div class="one-container">
                <div class="yellow-box"></div>
                <div class="gray-box"></div>
        </div>
        <div class="two-container"></div>
        <div class="three-container">
            <div class="yellow-box2"></div>
            <div class="peach-box"></div>
        </div>
        <div class="last-box">
            <div class="yellow01-box"></div>
            <div class="blue01-box"></div>
            <div class="violet-box"></div>
            <div class="mint-box"></div>
        </div>
    </div>
</body>

</html>
