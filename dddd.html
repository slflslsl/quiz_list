<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 500px;
            height: 100px;
            background-color: aquamarine;

            margin: 0 auto;
            margin-top: 50px;
        }
        .red-box {
            width: 250px;
            height: 100px;
            background-color: red;
            display: inline-block;
        }
        .green-box {
            width: 250px;
            height: 100px;
            background-color: green;
            display: inline-block;
        }
        .blue-box {
            width: 500px;
            height: 200px;
            background-color: blue;
            margin: 0 auto;
        }
        .text-box {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="red-box"></div><div class="green-box"></div>
    
        <div class="text-box">글자가운데정렬</div>
        <div class="blue-box"></div>
    </div>

</body>
</html>
