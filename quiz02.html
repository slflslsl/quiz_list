<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    고객명: <input type="text"> <br><br>
    전화번호: <input type="tel"> <br><br>
    E-mail: <input type="email"> <br><br>

    <br><br>
    피자선택 :
    <select>
        <option selected disabled>피자를 선택하세요</option>
        <option>치즈</option>
        <option>페퍼로니</option>
        <option>콤비네이션</option>

    <fieldset>
        <legend>피자 사이즈</legend>
        <label><input type="radio" name="pz_size" checked> Small</label>
        <label><input type="radio" name="pz_size"> Medium</label>
        <label><input type="radio" name="pz_size"> Large</label>
    </fieldset>

        <fieldset>
        <legend>토핑 선택</legend>
        <label><input type="checkbox" name="to_size">베이컨</label> <br><br>
        <label><input type="checkbox" name="to_size">치즈</label> <br><br>
        <label><input type="checkbox" name="to_size">양파</label> <br><br>
        <label><input type="checkbox" name="to_size">버섯</label> <br><br>
    </fieldset>
     희망배송시간 : <input type="time"> <br><br>
     배송시 요청사항 : <textarea></textarea> <br><br>

     
     <button type="submit">주문하기</button>

    </form>
