<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 카드 만들기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card {
            width:300px;
            margin: 0 auto;
            margin: 50px auto;
            border: 2px solid black;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
            border-radius: 18px;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            background-color: orange;
            margin: 0 auto;
            position: relative;
            border-radius: 50%;
        }
        h2 {
            text-align: center;
            margin: 10px;
        }
        .status-badge {
            width: 60px;
            height: 30px;
            background-color: green;
            color: white;
            text-align: center;
            position: absolute;
            bottom: 0;
            right: -10px;
            line-height: 30px;
            z-index: 1;
            border-radius: 50px;
        }
        p {
           color: gray;
           margin-top: 10px;
           text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="profile-img">
            <div class="status-badge">온라인</div>
        </div>
            <h2>홍길동</h2>
            <p>안녕하세요! 열심히 공부하는 개발자입니다.</p>
    </div>
</body>
</html>
