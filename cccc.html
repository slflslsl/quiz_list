<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 800px;
            height: 500px;
            background-color: rgb(209, 208, 208);
            margin: 0 auto;
            /* overflow: hidden; */
        }

        .header { display: flex;}

        .header-left {
            width: 50%;
            height: 100px;
            background-color: yellow;
        }

        .header-right {
            width: 50%;
            height: 100px;
            background-color: gray;
        }

        .nav {
            width: 100%;
            height: 100px;
            background-color: purple;
        }
        
        .main-left {
            width: 40%;
            height: 200px;
            background-color: lightblue;
        }

        .main-right {
            width: 60%;
            height: 200px;
            background-color: darkgoldenrod;
        }

        .main {
            display: flex;
        }

        .main-right-1 {
            background-color: yellow;
            height: 100px;
        }
        .main-right-2 {
         background-color: darksalmon;
        height: 100px;
        }

        .footer-1 {
            width: 25%;
            height: 100px;
            background-color: rgb(240, 141, 195);
        }
        .footer-2 {
            width: 25%;
            height: 100px;
            background-color: rgb(167, 156, 231);
        }
        .footer-3 {
            width: 25%;
            height: 100px;
            background-color: rgb(35, 63, 99);
        }
        .footer-4 {
            width: 25%;
            height: 100px;
            background-color: rgb(33, 139, 65);
        }

        .footer {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left"></div>
            <div class="header-right"></div>
        </div>

        <div class="nav"></div>
        <div class="main">
            <div class="main-left"></div>
            <div class="main-right">
                <div class="main-right-1"></div>
                <div class="main-right-2"></div>
                </div>
        </div>
        <div class="footer">
        <div class="footer-1"></div>
        <div class="footer-2"></div>
        <div class="footer-3"></div>
        <div class="footer-4"></div>
        </div>
    </div>
</body>
</html>
